name: Ferrox Front Release & Wasm Packaging Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run publication (skip actual upload)'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CROSS-PLATFORM TEST MATRIX
  # =========================================================================
  test-cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Workspace Compilation Check (Wasm32)
        run: cargo check --target wasm32-unknown-unknown --workspace

      - name: Run Unit & Doc Tests
        run: cargo test --workspace

  # =========================================================================
  # 2. WASM BYTECODE BUILD & WASM-OPT OPTIMIZATION
  # =========================================================================
  build-wasm-optimized:
    name: Build & Optimize WebAssembly (Trunk + wasm-opt -Oz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Binaryen (wasm-opt) & Trunk
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C /usr/local/bin/

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Admin Dashboard Showcase via Trunk
        run: |
          cd examples/admin-dashboard
          trunk build --release --dist ../../dist/admin-dashboard --public-url /wasm/admin-dashboard/

      - name: Run wasm-opt -Oz on Artifacts
        run: |
          for f in dist/admin-dashboard/*.wasm; do
            if [ -f "$f" ]; then
              echo "Applying wasm-opt -Oz to $f..."
              wasm-opt -Oz "$f" -o "$f"
            fi
          done

      - name: Upload Optimized Showcase Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferrox-front-admin-dashboard-wasm
          path: dist/admin-dashboard/

  # =========================================================================
  # 3. MULTI-ARCH DOCKER CONTAINER IMAGES
  # =========================================================================
  docker-multiarch:
    name: Build Docker Multi-Arch (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Arch Docker Image (Dry Run / Validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 4. CRATE PUBLISHING PIPELINE (TOPOLOGICAL ORDER)
  # =========================================================================
  publish-crates:
    name: Publish Crates to Crates.io
    needs: [test-cross-platform, build-wasm-optimized, docker-multiarch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.dry_run == 'false'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish Crates Sequentially
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          node publish_crates.js
