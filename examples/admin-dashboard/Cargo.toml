[package]
description = "Full SaaS admin dashboard showcase application demonstrating Ferrox Front Wasm architecture."
name = "admin-dashboard"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wasm-bindgen = "0.2"
ferrox-front-core = { path = "../../crates/ferrox-front-core", version = "0.3.1" }
ferrox-front-ws = { path = "../../crates/ferrox-front-ws", version = "0.3.1" }
ferrox-front-ui = { path = "../../crates/ferrox-front-ui", version = "0.3.1" }
ferrox-front-charts = { path = "../../crates/ferrox-front-charts", version = "0.3.1" }
ferrox-front-macro = { path = "../../crates/ferrox-front-macro", version = "0.3.1" }
ferrox-front-router = { path = "../../crates/ferrox-front-router", version = "0.3.1" }
ferrox-front-templates = { path = "../../crates/ferrox-front-templates", version = "0.3.1" }
ferrox-front-security = { path = "../../crates/ferrox-front-security", version = "0.3.1" }
ferrox-engine = { path = "../../../ferrox-match/packages/ferrox-engine", version = "0.1.0", default-features = false }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration", "Navigator", "Clipboard", "Node", "MessageEvent"] }

[lib]
crate-type = ["cdylib"]
