<!DOCTYPE html>
<html lang="en" data-theme="ferrox-cyber">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Ferrox Codex • Native WebAssembly Documentation Engine</title>
    <meta name="description" content="Native WebAssembly documentation engine & static generator for the Ferrox ecosystem. Replaces Docusaurus with pure Rust WebAssembly dogfooding.">
    <!-- SEO & Social OpenGraph Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Ferrox Codex">
    <meta property="og:title" content="⚡ Ferrox Codex • Native WebAssembly Documentation Engine">
    <meta property="og:description" content="Next-gen WebAssembly documentation platform for the Ferrox ecosystem: zero Node.js, vector Mermaid SVG, responsive microfrontends, and 1M row live Wasm DataGrid.">
    <meta property="og:url" content="https://ferrox-rust.dev">
    <meta property="og:image" content="https://ferrox-rust.dev/img/og-preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@ferrox_rust">
    <meta name="twitter:title" content="⚡ Ferrox Codex • Native Wasm Documentation Platform">
    <meta name="twitter:description" content="Next-gen WebAssembly documentation platform for the Ferrox ecosystem: zero Node.js, vector Mermaid SVG, and interactive Wasm sandboxes.">
    <meta name="twitter:image" content="https://ferrox-rust.dev/img/og-preview.png">
    <meta name="keywords" content="ferrox, rust, wasm, webassembly, docusaurus-alternative, documentation, mermaid, microfrontend">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link data-trunk rel="css" href="styles.css">
    <link data-trunk rel="rust" href="Cargo.toml" data-target-name="ferrox_codex" data-wasm-opt="z">
    <!-- Mermaid.js Vector Diagram Engine with Ferrox Dark Theme -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        if (window.mermaid) {
            mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                securityLevel: 'loose',
                themeVariables: {
                    darkMode: true,
                    background: 'transparent',
                    mainBkg: '#090d16',
                    nodeBorder: '#6366f1',
                    primaryColor: '#1e1b4b',
                    primaryTextColor: '#f8fafc',
                    primaryBorderColor: '#6366f1',
                    lineColor: '#818cf8',
                    secondaryColor: '#0e7490',
                    tertiaryColor: '#1e293b',
                    fontFamily: 'JetBrains Mono, Inter, monospace'
                }
            });
        }
        window.initFerroxMermaidPanZoom = function() {
            var containers = document.querySelectorAll('.ferrox-mermaid');
            containers.forEach(function(container) {
                if (container.dataset.panzoomActive === 'true') {
                    var svg = container.querySelector('.ferrox-mermaid-canvas svg');
                    if (svg) {
                        svg.style.maxWidth = 'none';
                        svg.style.height = 'auto';
                        svg.style.pointerEvents = 'none';
                    }
                    return;
                }
                container.dataset.panzoomActive = 'true';

                var viewport = container.querySelector('.ferrox-mermaid-viewport');
                var canvas = container.querySelector('.ferrox-mermaid-canvas');
                var zoomBadge = container.querySelector('.ferrox-mermaid-zoom-badge');
                var btnZoomIn = container.querySelector('.ferrox-mermaid-zoom-in');
                var btnZoomOut = container.querySelector('.ferrox-mermaid-zoom-out');
                var btnReset = container.querySelector('.ferrox-mermaid-reset');
                var btnFullscreen = container.querySelector('.ferrox-mermaid-fullscreen');

                if (!viewport || !canvas) return;

                var state = {
                    scale: 1.0,
                    translateX: 0,
                    translateY: 0,
                    isDragging: false,
                    startX: 0,
                    startY: 0,
                    initX: 0,
                    initY: 0,
                    isFullscreen: false,
                    touchDist: 0,
                    touchScale: 1.0,
                    isTouching: false
                };

                function applyTransform(animate) {
                    canvas.style.transition = animate ? 'transform 0.18s cubic-bezier(0.2, 0, 0, 1)' : 'none';
                    canvas.style.transform = 'translate(' + state.translateX + 'px, ' + state.translateY + 'px) scale(' + state.scale + ')';
                    if (zoomBadge) {
                        zoomBadge.textContent = Math.round(state.scale * 100) + '%';
                    }
                }

                function zoomBy(factor, centerX, centerY) {
                    var oldScale = state.scale;
                    var newScale = Math.min(Math.max(oldScale * factor, 0.25), 6.0);
                    if (centerX !== undefined && centerY !== undefined) {
                        state.translateX -= centerX * (newScale / oldScale - 1);
                        state.translateY -= centerY * (newScale / oldScale - 1);
                    }
                    state.scale = newScale;
                    applyTransform(true);
                }

                function resetView() {
                    state.scale = 1.0;
                    state.translateX = 0;
                    state.translateY = 0;
                    applyTransform(true);
                }

                if (btnZoomIn) {
                    btnZoomIn.onclick = function(e) {
                        e.stopPropagation();
                        zoomBy(1.25);
                    };
                }

                if (btnZoomOut) {
                    btnZoomOut.onclick = function(e) {
                        e.stopPropagation();
                        zoomBy(0.8);
                    };
                }

                if (btnReset) {
                    btnReset.onclick = function(e) {
                        e.stopPropagation();
                        resetView();
                    };
                }

                function toggleFullscreen() {
                    state.isFullscreen = !state.isFullscreen;
                    if (state.isFullscreen) {
                        container.classList.add('ferrox-mermaid-fullscreen-mode');
                        if (btnFullscreen) {
                            btnFullscreen.textContent = '✕ Collapse';
                            btnFullscreen.title = 'Exit Fullscreen (Esc)';
                        }
                        document.body.style.overflow = 'hidden';
                    } else {
                        container.classList.remove('ferrox-mermaid-fullscreen-mode');
                        if (btnFullscreen) {
                            btnFullscreen.textContent = '⛶ Expand';
                            btnFullscreen.title = 'Toggle Fullscreen View';
                        }
                        document.body.style.overflow = '';
                    }
                    resetView();
                }

                if (btnFullscreen) {
                    btnFullscreen.onclick = function(e) {
                        e.stopPropagation();
                        toggleFullscreen();
                    };
                }

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && state.isFullscreen) {
                        toggleFullscreen();
                    }
                });

                viewport.addEventListener('mousedown', function(e) {
                    if (e.button !== 0) return;
                    state.isDragging = true;
                    state.startX = e.clientX;
                    state.startY = e.clientY;
                    state.initX = state.translateX;
                    state.initY = state.translateY;
                    viewport.style.cursor = 'grabbing';
                    e.preventDefault();
                });

                window.addEventListener('mousemove', function(e) {
                    if (!state.isDragging) return;
                    var dx = e.clientX - state.startX;
                    var dy = e.clientY - state.startY;
                    state.translateX = state.initX + dx;
                    state.translateY = state.initY + dy;
                    applyTransform(false);
                });

                window.addEventListener('mouseup', function() {
                    if (state.isDragging) {
                        state.isDragging = false;
                        viewport.style.cursor = 'grab';
                    }
                });

                viewport.addEventListener('wheel', function(e) {
                    e.preventDefault();
                    var rect = viewport.getBoundingClientRect();
                    var mouseX = e.clientX - rect.left - rect.width / 2;
                    var mouseY = e.clientY - rect.top - rect.height / 2;
                    var factor = e.deltaY < 0 ? 1.15 : 0.87;
                    zoomBy(factor, mouseX, mouseY);
                }, { passive: false });

                viewport.addEventListener('touchstart', function(e) {
                    if (e.touches.length === 1) {
                        state.isTouching = true;
                        state.startX = e.touches[0].clientX;
                        state.startY = e.touches[0].clientY;
                        state.initX = state.translateX;
                        state.initY = state.translateY;
                    } else if (e.touches.length === 2) {
                        state.isTouching = false;
                        state.touchDist = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        state.touchScale = state.scale;
                    }
                }, { passive: true });

                viewport.addEventListener('touchmove', function(e) {
                    if (e.touches.length === 1 && state.isTouching) {
                        var dx = e.touches[0].clientX - state.startX;
                        var dy = e.touches[0].clientY - state.startY;
                        state.translateX = state.initX + dx;
                        state.translateY = state.initY + dy;
                        applyTransform(false);
                        e.preventDefault();
                    } else if (e.touches.length === 2 && state.touchDist > 0) {
                        var currentDist = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        var ratio = currentDist / state.touchDist;
                        state.scale = Math.min(Math.max(state.touchScale * ratio, 0.25), 6.0);
                        applyTransform(false);
                        e.preventDefault();
                    }
                }, { passive: false });

                viewport.addEventListener('touchend', function(e) {
                    if (e.touches.length === 0) {
                        state.isTouching = false;
                        state.touchDist = 0;
                    } else if (e.touches.length === 1) {
                        state.isTouching = true;
                        state.startX = e.touches[0].clientX;
                        state.startY = e.touches[0].clientY;
                        state.initX = state.translateX;
                        state.initY = state.translateY;
                    }
                }, { passive: true });

                var svg = canvas.querySelector('svg');
                if (svg) {
                    svg.style.maxWidth = 'none';
                    svg.style.height = 'auto';
                    svg.style.pointerEvents = 'none';
                }
            });
        };

        window.renderFerroxMermaid = function() {
            if (window.mermaid) {
                try {
                    var res = mermaid.run({
                        querySelector: '.ferrox-mermaid-raw'
                    });
                    if (res && typeof res.then === 'function') {
                        res.then(function() {
                            window.initFerroxMermaidPanZoom();
                        }).catch(function(e) {
                            console.warn('[FerroxCodex] Mermaid run error:', e);
                            window.initFerroxMermaidPanZoom();
                        });
                    } else {
                        window.initFerroxMermaidPanZoom();
                    }
                } catch (e) {
                    console.warn('[FerroxCodex] Mermaid render notice:', e);
                    window.initFerroxMermaidPanZoom();
                }
            }
        };
    </script>
</head>
<body data-theme="ferrox-cyber" class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root">
        <!-- Initial Glassmorphic Wasm Loader -->
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #030712; color: #94a3b8; font-family: 'Inter', system-ui, sans-serif; gap: 20px;">
            <div style="position: relative; width: 64px; height: 64px;">
                <div style="position: absolute; inset: 0; border: 3px solid rgba(99, 102, 241, 0.15); border-top-color: #6366f1; border-radius: 50%; animation: ferrox-loader-spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
                <div style="position: absolute; inset: 6px; border: 3px solid rgba(6, 182, 212, 0.15); border-bottom-color: #06b6d4; border-radius: 50%; animation: ferrox-loader-spin 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite reverse;"></div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
                <div style="font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; color: #ffffff; display: flex; align-items: center; gap: 8px;">
                    <span>FERROX</span>
                    <span style="color: #818cf8; font-weight: 300;">CODEX</span>
                </div>
                <div style="font-size: 0.8rem; color: #64748b; font-family: 'JetBrains Mono', monospace;">Initializing Native Rust WebAssembly Engine...</div>
            </div>
            <div style="font-size: 0.72rem; color: #475569; max-width: 320px; text-align: center;">Zero JavaScript Overhead • Viewport Virtualization • O(1) Signal Reactivity</div>
        </div>
        <style>
            @keyframes ferrox-loader-spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </div>
</body>
</html>
