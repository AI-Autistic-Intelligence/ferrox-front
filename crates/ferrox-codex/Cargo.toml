[package]
name = "ferrox-codex"
version = "0.1.0"
edition = "2021"
description = "Native WebAssembly documentation engine & generator for the Ferrox ecosystem, powered by ferrox-front."
license = "MIT"
repository = "https://github.com/AI-Autistic-Intelligence/ferrox-front"
homepage = "https://ferrox-front.dev"
documentation = "https://docs.ferrox-rust.dev"
readme = "README.md"
keywords = ["wasm", "documentation", "markdown", "docusaurus-alternative", "webassembly"]
categories = ["wasm", "development-tools::documentation"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ferrox-codex-cli"
path = "src/main.rs"


[dependencies]
ferrox-front-core = { path = "../ferrox-front-core", version = "0.3.2" }
ferrox-front-ui = { path = "../ferrox-front-ui", version = "0.3.2" }
ferrox-front-router = { path = "../ferrox-front-router", version = "0.3.2" }
ferrox-front-charts = { path = "../ferrox-front-charts", version = "0.3.2" }

pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "Location",
  "History",
  "EventTarget",
  "Event",
  "KeyboardEvent",
  "MouseEvent",
  "ScrollIntoViewOptions",
  "ScrollBehavior",
  "DomRect",
  "Navigator",
  "Clipboard"
]
