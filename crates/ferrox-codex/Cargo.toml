[package]
name = "ferrox-codex"
version = "0.1.1"
authors = ["Ferrox Architecture Group <dev@ferrox-rust.dev>"]
edition = "2021"
description = "High-performance zero-JavaScript WebAssembly documentation platform and static site generator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AI-Autistic-Intelligence/ferrox-front"
homepage = "https://ferrox-rust.dev"
documentation = "https://docs.rs/ferrox-codex"
readme = "README.md"
keywords = ["wasm", "documentation", "ssg", "zero-js", "ferrox"]
categories = ["web-programming", "development-tools"]
exclude = ["dist", "spa_server.py"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ferrox-codex-cli"
path = "src/main.rs"


[dependencies]
ferrox-front-core = { path = "../ferrox-front-core", version = "0.3.4" }
ferrox-front-ui = { path = "../ferrox-front-ui", version = "0.3.4" }
ferrox-front-router = { path = "../ferrox-front-router", version = "0.3.4" }
ferrox-front-charts = { path = "../ferrox-front-charts", version = "0.3.4" }

pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "Location",
  "History",
  "EventTarget",
  "Event",
  "KeyboardEvent",
  "MouseEvent",
  "ScrollIntoViewOptions",
  "ScrollBehavior",
  "DomRect",
  "Navigator",
  "Clipboard",
  "HtmlInputElement",
  "HtmlTextAreaElement"
]
