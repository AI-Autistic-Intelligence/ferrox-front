[package]
description = "Asynchronous WebAssembly WebSocket client for real-time bi-directional data streaming in Ferrox Front."
name = "ferrox-front-ws"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/AI-Autistic-Intelligence/ferrox-front"
homepage = "https://ferrox-front.dev"
documentation = "https://docs.ferrox-front.dev"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
ferrox-front-core = { path = "../ferrox-front-core", version = "0.1.1" }

[dependencies.web-sys]
version = "0.3"
features = [
  "WebSocket",
  "MessageEvent",
  "ErrorEvent",
  "console",
]


