[package]
description = "Asynchronous WebAssembly WebSocket client for real-time bi-directional data streaming in Ferrox Front."
name = "ferrox-front-ws"
version = "0.1.0"
edition = "2021"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
ferrox-front-core = { path = "../ferrox-front-core" }

[dependencies.web-sys]
version = "0.3"
features = [
  "WebSocket",
  "MessageEvent",
  "ErrorEvent",
  "console",
]
