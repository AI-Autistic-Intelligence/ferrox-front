[package]
name = "ferrox-front-ws"
version = "0.3.4"
edition = "2021"
description = "Asynchronous WebAssembly WebSocket client with auto-reconnect, exponential backoff, jitter and typed event dispatcher."
license = "MIT"
repository = "https://github.com/AI-Autistic-Intelligence/ferrox-front"
homepage = "https://ferrox-front.dev"
documentation = "https://docs.ferrox-front.dev"
readme = "README.md"
keywords = ["wasm", "websocket", "realtime", "market-data"]
categories = ["wasm", "network-programming"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ferrox-front-core = { path = "../ferrox-front-core", version = "0.3.4" }

[dependencies.web-sys]
version = "0.3"
features = [
  "WebSocket",
  "MessageEvent",
  "ErrorEvent",
  "CloseEvent",
  "Window",
  "console",
]
