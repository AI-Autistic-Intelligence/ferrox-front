[package]
description = "Zero-Trust RBAC route guards, Wasm memory anti-tampering token protection, and WebAuthn Passkeys integration."
name = "ferrox-front-security"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AI-Autistic-Intelligence/ferrox-front"
homepage = "https://ferrox-front.dev"
documentation = "https://docs.ferrox-front.dev"

[dependencies]
ferrox-front-core = { path = "../ferrox-front-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Crypto",
    "SubtleCrypto",
    "Window",
    "Navigator",
    "CredentialsContainer",
    "CredentialRequestOptions",
    "PublicKeyCredential",
    "PublicKeyCredentialRequestOptions",
    "PublicKeyCredentialCreationOptions"
]

