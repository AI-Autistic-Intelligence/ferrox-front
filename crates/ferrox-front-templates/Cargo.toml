[package]
name = "ferrox-front-templates"
version = "0.3.3"
edition = "2021"
description = "Production-ready enterprise SaaS page templates (Auth pages, Pricing tables, Admin Dashboard layouts)."
license = "MIT"
repository = "https://github.com/AI-Autistic-Intelligence/ferrox-front"
homepage = "https://ferrox-front.dev"
documentation = "https://docs.ferrox-front.dev"
readme = "README.md"
keywords = ["wasm", "templates", "dashboard", "saas"]
categories = ["wasm", "gui"]

[dependencies]
ferrox-front-core = { path = "../ferrox-front-core", version = "0.3.3" }
ferrox-front-ui = { path = "../ferrox-front-ui", version = "0.3.3" }
ferrox-front-macro = { path = "../ferrox-front-macro", version = "0.3.3" }
web-sys = { version = "0.3", features = ["console"] }
