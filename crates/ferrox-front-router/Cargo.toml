[package]
description = "Client-side History API Single Page Application (SPA) router with dynamic parameters and navigation guards."
name = "ferrox-front-router"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AI-Autistic-Intelligence/ferrox-front"
homepage = "https://ferrox-front.dev"
documentation = "https://docs.ferrox-front.dev"

[dependencies]
wasm-bindgen = "0.2"
ferrox-front-core = { path = "../ferrox-front-core" }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "History",
  "Location"
]

