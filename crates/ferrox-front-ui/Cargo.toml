[package]
description = "12-column responsive Grid system, virtualized DataGrid (1M rows), and Bootstrap-style UI components in Rust Wasm."
name = "ferrox-front-ui"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AI-Autistic-Intelligence/ferrox-front"
homepage = "https://ferrox-front.dev"
documentation = "https://docs.ferrox-front.dev"

[dependencies]
ferrox-front-core = { path = "../ferrox-front-core", version = "0.3.0" }
ferrox-front-charts = { path = "../ferrox-front-charts", version = "0.3.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3.105", features = ["Event", "DragEvent", "DataTransfer", "Storage", "Window", "Location", "HtmlElement", "HtmlCollection", "HtmlAudioElement", "ResizeObserver", "ResizeObserverEntry", "DomRectReadOnly", "MouseEvent"] }
wasm-bindgen = "0.2.128"
js-sys = "0.3.105"


